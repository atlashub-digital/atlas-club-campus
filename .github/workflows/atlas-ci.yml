name: Atlas Campus validation
on:
  push:
    branches: [feat/clubos-bootstrap, feat/clubos-design-system]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: atlas-campus-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Verify upstream and generated configuration
        run: |
          node scripts/atlas/verify-upstream.mjs
          bun test scripts/atlas/dev-config.test.ts
          bun scripts/atlas/dev-config.ts
          docker compose -f .atlas/dev/docker-compose.yml --env-file .atlas/dev/.env config --quiet
      - name: Build this PR's real Web, API and Collab
        run: docker build --build-arg LEARNHOUSE_PUBLIC=true -t atlas-club-campus:dev .
      - name: Start isolated PostgreSQL, Redis and LMS
        run: docker compose -f .atlas/dev/docker-compose.yml --env-file .atlas/dev/.env up -d --wait --wait-timeout 300
      - name: Install acceptance tools
        working-directory: apps/e2e
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium
      - name: Functional acceptance and screenshots
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_ORG_SLUG: atlas-club
          E2E_ADMIN_EMAIL: admin@atlas-campus.example.com
        run: |
          export E2E_ADMIN_PASSWORD="$(sed -n 's/^LEARNHOUSE_INITIAL_ADMIN_PASSWORD=//p' .atlas/dev/.env | tr -d '\r')"
          echo "::add-mask::$E2E_ADMIN_PASSWORD"
          cd apps/e2e
          bunx playwright test --config atlas.config.ts
      - name: Restart all services preserving volumes
        run: |
          docker compose -f .atlas/dev/docker-compose.yml --env-file .atlas/dev/.env stop -t 30
          docker compose -f .atlas/dev/docker-compose.yml --env-file .atlas/dev/.env up -d --wait --wait-timeout 300
      - name: Verify persistence after restart
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_ORG_SLUG: atlas-club
        working-directory: apps/e2e
        run: bunx playwright test --config atlas-restart.config.ts
      - name: Restore educational data into separate DB
        run: bash scripts/atlas/backup-restore.sh
      - name: Upload sanitized acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-campus-evidence
          path: |
            apps/e2e/atlas-results/
            apps/e2e/atlas-report/
            apps/e2e/atlas-restart-results/
            apps/e2e/atlas-restart-report/
            .atlas/evidence/restore.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Stop disposable stack
        if: always()
        run: docker compose -f .atlas/dev/docker-compose.yml --env-file .atlas/dev/.env down -v
